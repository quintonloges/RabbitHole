name: Deploy to DigitalOcean
on:
  push:
    branches: ['codex/rabbithole', main]
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        default: production
        description: GitHub environment holding server SSH configuration
      platform:
        type: choice
        options: [linux/amd64, linux/arm64]
        default: linux/amd64
        description: DigitalOcean server CPU architecture
      apply_source_pack:
        type: boolean
        default: false
        description: Verify and activate missing curated sources after launch; preserve existing subscriptions
permissions:
  contents: read
concurrency:
  group: rabbithole-deploy-${{ inputs.environment || 'production' }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref_name == github.event.repository.default_branch || inputs.environment == 'staging'
    uses: ./.github/workflows/ci.yml
  release:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: ${{ inputs.environment || 'production' }}
      url: ${{ (inputs.environment || 'production') == 'production' && 'https://rabbithole.quintonloges.me' || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment configuration
        env:
          SSH_HOST: ${{ secrets.SSH_HOST || vars.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER || vars.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || vars.SSH_PORT || '22' }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY || secrets.SSH_SECRET }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment || 'production' }}
          DEPLOY_ADMIN_PASSWORD: ${{ secrets.DEPLOY_ADMIN_PASSWORD }}
        run: |
          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Add $name in repository or deployment-environment Actions secrets."
              exit 1
            fi
          done
          if [[ "$DEPLOY_ENVIRONMENT" == production && -z "$DEPLOY_ADMIN_PASSWORD" ]]; then
            echo '::error::Add DEPLOY_ADMIN_PASSWORD to the production environment secrets. The site has not been changed.'
            exit 1
          fi
          if ! [[ "$SSH_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]+$ && "$SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]; then
            echo '::error::SSH_HOST or SSH_USER has an invalid format.'
            exit 1
          fi
          if ! [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] || (( 10#$SSH_PORT < 1 || 10#$SSH_PORT > 65535 )); then
            echo '::error::SSH_PORT must be a number from 1 to 65535.'
            exit 1
          fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build and pin release images
        env:
          PLATFORM: ${{ inputs.platform || 'linux/amd64' }}
        run: |
          docker buildx build --platform "$PLATFORM" --load -f apps/api/Dockerfile -t "rabbithole-api:$GITHUB_SHA" .
          docker buildx build --platform "$PLATFORM" --load -t "rabbithole-web:$GITHUB_SHA" apps/web
          docker pull --platform "$PLATFORM" postgres:17-alpine
          docker pull --platform "$PLATFORM" caddy:2-alpine
          docker tag postgres:17-alpine "rabbithole-postgres:$GITHUB_SHA"
          docker tag caddy:2-alpine "rabbithole-caddy:$GITHUB_SHA"
          docker save "rabbithole-api:$GITHUB_SHA" "rabbithole-web:$GITHUB_SHA" "rabbithole-postgres:$GITHUB_SHA" "rabbithole-caddy:$GITHUB_SHA" | gzip >images.tar.gz
          sha256sum images.tar.gz >bundle.sha256
          tar -czf release.tar.gz images.tar.gz bundle.sha256 compose.hosted.yaml compose.staging.yaml Caddyfile.hosted Caddyfile.staging scripts/hosted scripts/admin_client.py scripts/preservation-manifest.py scripts/apply-source-pack.py config/curated-source-pack.json
      - name: Transfer, verify backups and launch the approved release
        env:
          SSH_HOST: ${{ secrets.SSH_HOST || vars.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER || vars.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || vars.SSH_PORT || '22' }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY || secrets.SSH_SECRET }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment || 'production' }}
          DEPLOY_ADMIN_PASSWORD: ${{ secrets.DEPLOY_ADMIN_PASSWORD }}
          APPLY_SOURCE_PACK: ${{ inputs.apply_source_pack || false }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/id_ed25519' EXIT
          SSH_TARGET="$SSH_USER@$SSH_HOST"
          RH_CONFIG=/etc/rabbithole/hosted.env
          if [[ "$DEPLOY_ENVIRONMENT" == staging ]]; then RH_CONFIG=/etc/rabbithole/staging.env; fi
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          SSH_OPTIONS=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=6)
          SSH=(ssh -p "$SSH_PORT" "${SSH_OPTIONS[@]}" "$SSH_TARGET")
          release=/srv/rabbithole/releases/$GITHUB_SHA
          # A rerun reuses the installed immutable bundle; it never overwrites pins.
          if "${SSH[@]}" "test -f $release/release.env"; then
            echo 'Reusing the existing pinned release bundle.'
          else
            "${SSH[@]}" "mkdir -p $release"
            scp -P "$SSH_PORT" "${SSH_OPTIONS[@]}" release.tar.gz "$SSH_TARGET:$release/release.tar.gz"
            "${SSH[@]}" "cd $release && tar -xzf release.tar.gz"
          fi
          if [[ "$DEPLOY_ENVIRONMENT" == production ]]; then
            source_option=''
            [[ "$APPLY_SOURCE_PACK" != true ]] || source_option='--apply-source-pack'
            # Secret travels only on encrypted stdin, never argv, release files or logs.
            printf '%s' "$DEPLOY_ADMIN_PASSWORD" | "${SSH[@]}" "RH_CONFIG=$RH_CONFIG bash $release/scripts/hosted/release.sh $release $source_option"
          else
            "${SSH[@]}" "RH_CONFIG=$RH_CONFIG bash $release/scripts/hosted/deploy.sh $release"
          fi
      - name: Release result
        if: success()
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment || 'production' }}
        run: |
          if [[ "$DEPLOY_ENVIRONMENT" == production ]]; then
            echo 'Approved release passed backup restoration, privacy and HTTPS checks and is live at https://rabbithole.quintonloges.me.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Staging release installed in maintenance; it is not public.' >> "$GITHUB_STEP_SUMMARY"
          fi
