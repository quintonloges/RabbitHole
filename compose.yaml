# The working checkout is always development. Production is a pinned local snapshot;
# use scripts/production.ps1 to manage it without rebuilding application images.
name: rabbithole-dev
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rabbithole
      POSTGRES_USER: rabbithole
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rabbithole-local-only}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U rabbithole -d rabbithole']
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=db;Database=rabbithole;Username=rabbithole;Password=${POSTGRES_PASSWORD:-rabbithole-local-only}
      Documents__Path: /data/uploads
      OpenAlex__ApiKey: ${OPENALEX_API_KEY:-}
      AI__BaseUrl: ${AI_BASE_URL:-}
      AI__Model: ${AI_MODEL:-}
      AI__ApiKey: ${AI_API_KEY:-}
      AI__AllowLocal: ${AI_ALLOW_LOCAL:-false}
      AI__TokenParameter: ${AI_TOKEN_PARAMETER:-max_completion_tokens}
      Logging__LogLevel__System.Net.Http.HttpClient: Warning
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 1g
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:8080/api/healthz]
      interval: 10s
      timeout: 5s
      retries: 20
  web:
    build:
      context: ./apps/web
    restart: unless-stopped
    environment:
      NEXT_TELEMETRY_DISABLED: '1'
      HOSTNAME: 0.0.0.0
      PORT: '3000'
      API_ORIGIN: http://api:8080
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:${PORT:-47832}:80'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
volumes:
  database:
  uploads:
